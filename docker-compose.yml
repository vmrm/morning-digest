services:
  morning-digest:
    build: .
    container_name: morning-digest
    restart: unless-stopped
    env_file: .env
    # Ограничиваем логи, чтобы не забить диск NAS со временем
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # Скромный лимит памяти — сервис почти всё время спит.
    # CPU-лимит (cpus) не ставим: ядро Synology не поддерживает CFS-квоты.
    mem_limit: 128m
